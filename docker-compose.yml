services:
  blog:
    build: .
    container_name: start-blog
    ports:
      - "3000:3000"
    # 环境变量放在 .env.docker（已 gitignore，模板见 .env.docker.example）
    env_file:
      - .env.docker
    volumes:
      # SQLite 数据库 + 每日备份（务必持久化）
      - ./data:/app/data
      # 编辑器上传的图片（务必持久化）
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
